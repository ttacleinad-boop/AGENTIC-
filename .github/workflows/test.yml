name: Agentic Core Regression

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m compileall -q src tests server.py
      - run: agentic-core evaluate
